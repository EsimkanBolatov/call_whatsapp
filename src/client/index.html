<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Экстренный вызов 102</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #3b82f6;
        --danger: #ef4444;
        --bg: #0f172a;
        --text: #f1f5f9;
        --gray: #1e293b;
        --border: #334155;
        --card-bg: #1e293b;
        --hover: #334155;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .container {
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      .header {
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.5rem;
      }

      .header p {
        color: #6c757d;
        font-size: 0.9rem;
      }

      .call-section {
        background: var(--gray);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .status-text {
        margin-bottom: 2rem;
        font-size: 1.1rem;
        font-weight: 500;
        min-height: 1.5rem;
        color: #6c757d;
      }

      #status.listening {
        color: var(--primary);
        font-weight: bold;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }

      .btn-main {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: none;
        background-color: var(--primary);
        color: white;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: 0 4px 15px rgba(0, 86, 179, 0.3);
      }

      .btn-main:active {
        transform: scale(0.95);
      }

      .btn-main span {
        font-size: 2rem;
      }

      /* Red state for active call (Hangup) */
      .btn-main.active {
        background-color: var(--danger);
        box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
      }

      .btn-main:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      /* Hidden elements to keep JS working */
      .hidden {
        display: none !important;
      }

      #aiAvatar {
        transition: all 0.3s;
        margin-bottom: 20px;
        font-size: 3rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Экстренная служба</h1>
        <p>Нажмите кнопку для связи</p>
      </header>

      <div class="call-section">
        <div id="aiAvatar">🚨</div>
        <div class="status-text" id="status">Готов к работе</div>

        <!-- Single toggle button for UI simplicity -->
        <button class="btn-main" id="toggleCheck"><span>📞</span> Вызов</button>

        <!-- Hidden real controls -->
        <div class="hidden">
          <button id="callBtn">Call</button>
          <button id="hangupBtn">Hangup</button>
          <div id="transcript"></div>
          <div id="historyList"></div>
          <div id="volumeMeter"><div id="volumeBar"></div></div>
          <div id="cadCard"><div id="incidentPanel"></div></div>
        </div>
      </div>
    </div>

    <audio id="aiAudio"></audio>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      const socket = io();

      // Original DOM Elements (Logic preserved)
      const callBtn = document.getElementById("callBtn");
      const hangupBtn = document.getElementById("hangupBtn");
      const statusEl = document.getElementById("status");
      const aiAvatar = document.getElementById("aiAvatar");
      const transcriptEl = document.getElementById("transcript");
      const aiAudio = document.getElementById("aiAudio");
      const historyList = document.getElementById("historyList");
      const volumeMeter = document.getElementById("volumeMeter");
      const volumeBar = document.getElementById("volumeBar");
      const incidentPanel = document.getElementById("incidentPanel");

      // New UI Element
      const toggleCheck = document.getElementById("toggleCheck");

      // UI Logic Binding
      toggleCheck.onclick = () => {
        if (!isListening && !isRecording) {
          // Start Call
          callBtn.click();
        } else {
          // End Call
          hangupBtn.click();
        }
      };

      // State
      let sessionId = null;
      let audioContext = null;
      let mediaStream = null;
      let analyser = null;
      let processor = null;
      let audioChunks = [];

      // Voice Activity Detection settings
      const VAD_THRESHOLD = 0.04;
      const SILENCE_DURATION = 700;
      const MIN_SPEECH_DURATION = 400;
      const NOISE_FLOOR_SAMPLES = 30;

      let noiseFloor = 0.02;
      let noiseFloorSamples = [];
      let consecutiveSpeechFrames = 0;
      const SPEECH_CONFIRM_FRAMES = 3;
      const MAX_SPEECH_DURATION = 10000; // 10 seconds maximum recording

      let isListening = false;
      let isRecording = false;
      let isSpeaking = false;
      let isProcessing = false;
      let silenceTimer = null;
      let maxDurationTimer = null;
      let speechStartTime = null;
      let isAiSpeaking = false;

      // Connect to server
      socket.on("connect", () => {
        console.log("Connected to server");
        statusEl.innerText = "Готов к вызову";
      });

      socket.on("disconnect", () => {
        statusEl.innerText = "Нет соединения";
        toggleCheck.disabled = true;
        toggleCheck.style.backgroundColor = "#ccc";
      });

      // Start call with AI
      callBtn.onclick = async () => {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              sampleRate: 16000,
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              googEchoCancellation: true,
              googAutoGainControl: true,
              googNoiseSuppression: true,
              googHighpassFilter: true,
            },
          });

          // Collect device info
          const deviceInfo = {
            userAgent: navigator.userAgent,
            onLine: navigator.onLine,
          };

          socket.emit("call-ai", { deviceInfo });

          // UI Update
          toggleCheck.classList.add("active");
          toggleCheck.innerHTML = "<span>📵</span> Сброс";
          statusEl.innerText = "Подключение...";
        } catch (err) {
          statusEl.innerText = "Ошибка микрофона";
          console.error("Microphone error:", err);
        }
      };

      // AI call started
      socket.on("ai-call-started", (data) => {
        sessionId = data.sessionId;
        noiseFloorSamples = [];
        noiseFloor = 0.02;
        startListening();
      });

      function startListening() {
        if (!mediaStream) return;

        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 16000,
        });
        const source = audioContext.createMediaStreamSource(mediaStream);

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.3;
        source.connect(analyser);

        // Load AudioWorklet processor
        audioContext.audioWorklet.addModule('audio-processor.js').then(() => {
          console.log('[Main] AudioWorklet module loaded successfully');
          // Create AudioWorkletNode for recording
          processor = new AudioWorkletNode(audioContext, 'audio-recorder-processor');
          console.log('[Main] AudioWorkletNode created');

          // Handle messages from AudioWorklet
          processor.port.onmessage = (event) => {
            if (event.data.type === 'audioChunk' && isRecording) {
              // Add chunk to our audioChunks array for sending to server
              audioChunks.push(new Float32Array(event.data.chunk));
            } else if (event.data.type === 'audioData' && isRecording) {
              // Fallback: add all chunks at once (for stop recording)
              event.data.chunks.forEach(chunk => {
                audioChunks.push(new Float32Array(chunk));
              });
            }
          };

          source.connect(processor);
          processor.connect(audioContext.destination);

          isListening = true;
          statusEl.innerText = "Слушаю...";
          statusEl.classList.add("listening");
          aiAvatar.innerText = "👂";

          setTimeout(() => {
            statusEl.innerText = "Говорите...";
          }, 1000);

          detectVoiceActivity();
        }).catch(error => {
          console.error('[Main] Failed to load AudioWorklet:', error);
          // Fallback to old method if AudioWorklet fails
          fallbackToScriptProcessor(source, analyser);
        });
      }

      // Fallback function for older browsers or if AudioWorklet fails
      function fallbackToScriptProcessor(source, analyser) {
        console.log('[Main] Using fallback ScriptProcessorNode');
        // Processor for recording
        processor = audioContext.createScriptProcessor(2048, 1, 1);
        processor.onaudioprocess = (e) => {
          if (isRecording) {
            const inputData = e.inputBuffer.getChannelData(0);
            audioChunks.push(new Float32Array(inputData));
          }
        };
        source.connect(processor);
        processor.connect(audioContext.destination);

        isListening = true;
        statusEl.innerText = "Слушаю...";
        statusEl.classList.add("listening");
        aiAvatar.innerText = "👂";

        setTimeout(() => {
          statusEl.innerText = "Говорите...";
        }, 1000);

        detectVoiceActivity();
      }

      function detectVoiceActivity() {
        if (!isListening || !analyser) return;

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);

        const lowBin = Math.floor((100 * 1024) / 16000);
        const highBin = Math.floor((3000 * 1024) / 16000);

        let speechEnergy = 0;
        for (let i = lowBin; i <= highBin; i++) {
          speechEnergy += dataArray[i];
        }
        speechEnergy /= highBin - lowBin + 1;
        const volume = speechEnergy / 255;

        // Adaptive noise floor
        if (!isRecording && !isAiSpeaking) {
          noiseFloorSamples.push(volume);
          if (noiseFloorSamples.length > NOISE_FLOOR_SAMPLES) {
            noiseFloorSamples.shift();
          }
          const sorted = [...noiseFloorSamples].sort((a, b) => a - b);
          const lowerHalf = sorted.slice(0, Math.ceil(sorted.length / 2));
          if (lowerHalf.length > 0) {
            noiseFloor =
              lowerHalf.reduce((a, b) => a + b, 0) / lowerHalf.length + 0.015;
          }
        }

        const dynamicThreshold = Math.max(VAD_THRESHOLD, noiseFloor * 1.8);

        if (isAiSpeaking || isProcessing) {
          consecutiveSpeechFrames = 0;
          requestAnimationFrame(detectVoiceActivity);
          return;
        }

        const isCurrentlySpeaking = volume > dynamicThreshold;

        if (isCurrentlySpeaking && !isRecording) {
          consecutiveSpeechFrames++;
          if (consecutiveSpeechFrames >= SPEECH_CONFIRM_FRAMES) {
            startRecording();
          }
        } else if (!isCurrentlySpeaking && !isRecording) {
          consecutiveSpeechFrames = 0;
        } else if (isCurrentlySpeaking && isRecording) {
          clearTimeout(silenceTimer);
          silenceTimer = null;
          isSpeaking = true;
          statusEl.innerText = "Запись...";
        } else if (!isCurrentlySpeaking && isRecording && isSpeaking) {
          if (!silenceTimer) {
            statusEl.innerText = "Тишина...";
            silenceTimer = setTimeout(() => {
              const duration = Date.now() - speechStartTime;
              if (duration >= MIN_SPEECH_DURATION) {
                stopRecordingAndSend();
              } else {
                audioChunks = [];
                isRecording = false;
                isSpeaking = false;
                consecutiveSpeechFrames = 0;
                statusEl.innerText = "Слушаю...";
              }
            }, SILENCE_DURATION);
          }
        }

        requestAnimationFrame(detectVoiceActivity);
      }

      function startRecording() {
        audioChunks = [];
        isRecording = true;
        isSpeaking = true;
        speechStartTime = Date.now();
        console.log("Started recording");

        // Send message to AudioWorklet to start recording
        if (processor && processor.port) {
          processor.port.postMessage({ type: 'startRecording' });
        }

        // Set maximum recording duration timer
        maxDurationTimer = setTimeout(() => {
          console.log("Maximum recording duration reached");
          stopRecordingAndSend();
        }, MAX_SPEECH_DURATION);

        // Visual feedback
        aiAvatar.innerText = "🎤";
      }

      function stopRecordingAndSend() {
        isRecording = false;
        isSpeaking = false;
        isProcessing = true;
        consecutiveSpeechFrames = 0;
        clearTimeout(silenceTimer);
        silenceTimer = null;
        clearTimeout(maxDurationTimer);
        maxDurationTimer = null;

        // Send message to AudioWorklet to stop recording
        if (processor && processor.port) {
          processor.port.postMessage({ type: 'stopRecording' });
        }

        statusEl.innerText = "Обработка...";
        statusEl.classList.remove("listening");
        aiAvatar.innerText = "🧠";

        const audioBlob = exportAudio();
        socket.emit("audio-chunk", {
          sessionId: sessionId,
          audio: audioBlob,
        });
      }

      function exportAudio() {
        // Flatten chunks
        let totalLength = 0;
        for (let chunk of audioChunks) totalLength += chunk.length;
        const result = new Float32Array(totalLength);
        let offset = 0;
        for (let chunk of audioChunks) {
          result.set(chunk, offset);
          offset += chunk.length;
        }
        return result;
      }

      // Handle AI Audio Response
      socket.on("ai-audio_response", (data) => {
        isProcessing = false;
        statusEl.innerText = "Говорит диспетчер...";
        aiAvatar.innerText = "🗣️";

        const audioBlob = new Blob([data.audio], { type: "audio/mpeg" });
        const audioUrl = URL.createObjectURL(audioBlob);
        aiAudio.src = audioUrl;
        isAiSpeaking = true;

        aiAudio.onended = () => {
          isAiSpeaking = false;
          statusEl.innerText = "Слушаю...";
          statusEl.classList.add("listening");
          aiAvatar.innerText = "👂";
          URL.revokeObjectURL(audioUrl);
        };

        aiAudio.play().catch((e) => console.error("Audio play error", e));
      });

      // Update transcript (Empty handler for minimalist mode, or log to console)
      socket.on("transcription", (data) => {
        console.log("Transcription:", data);
        // No UI update needed
      });

      socket.on("incident-update", (data) => {
        console.log("Incident Update:", data);
      });

      // Hangup
      hangupBtn.onclick = () => {
        stopCall();
      };

      function stopCall() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        isListening = false;
        isRecording = false;

        // UI Reset
        toggleCheck.classList.remove("active");
        toggleCheck.innerHTML = "<span>📞</span> Вызов";
        toggleCheck.style.backgroundColor = ""; // Reset to default
        statusEl.innerText = "Вызов завершен";
        statusEl.classList.remove("listening");
        aiAvatar.innerText = "🚨";

        setTimeout(() => {
          statusEl.innerText = "Нажмите кнопку для связи";
        }, 2000);
      }
    </script>
  </body>
</html>
